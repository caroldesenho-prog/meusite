<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Documento</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #0b0e14;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    overflow: hidden;
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    box-sizing: border-box;
  }
  #stage {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    padding: 16px;
    box-sizing: border-box;
    overflow: hidden;
  }
  #stage canvas {
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    border-radius: 6px;
    box-shadow: 0 4px 28px rgba(0, 0, 0, 0.5);
    touch-action: pan-y;
    user-select: none;
  }
  .nav-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: none;
    background: rgba(255, 255, 255, 0.1);
    color: #fff;
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(4px);
    transition: background 0.15s;
  }
  .nav-btn:hover { background: rgba(255, 255, 255, 0.2); }
  .nav-btn:disabled { opacity: 0.25; cursor: default; }
  #prevBtn { left: 12px; }
  #nextBtn { right: 12px; }
  #footer {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 14px;
    color: #cbd2de;
    font-size: 13px;
  }
  #dots {
    display: flex;
    gap: 6px;
    max-width: 60vw;
    overflow-x: auto;
  }
  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #3a4152;
    flex-shrink: 0;
    cursor: pointer;
    transition: background 0.15s;
  }
  .dot.active { background: #7aa2ff; }
  #status {
    color: #cbd2de;
    text-align: center;
    padding: 60px 20px;
    font-size: 14px;
  }
</style>
</head>
<body>
  <div id="app">
    <div id="status">Carregando documento…</div>
    <div id="stage" style="display:none">
      <button id="prevBtn" class="nav-btn" aria-label="Página anterior">‹</button>
      <canvas id="pageCanvas"></canvas>
      <button id="nextBtn" class="nav-btn" aria-label="Próxima página">›</button>
    </div>
    <div id="footer" style="display:none">
      <span id="counter">1 / 1</span>
      <div id="dots"></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    // Troque "post3.pdf" pelo nome exato do seu arquivo PDF
    const PDF_URL = "post3.pdf";

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

    const status = document.getElementById("status");
    const stage = document.getElementById("stage");
    const footer = document.getElementById("footer");
    const canvas = document.getElementById("pageCanvas");
    const ctx = canvas.getContext("2d");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const counter = document.getElementById("counter");
    const dotsWrap = document.getElementById("dots");

    let pdfDoc = null;
    let currentPage = 1;
    let rendering = false;

    async function renderPage(num) {
      if (rendering) return;
      rendering = true;

      const page = await pdfDoc.getPage(num);
      const availW = stage.clientWidth - 32;
      const availH = stage.clientHeight - 32;
      const base = page.getViewport({ scale: 1 });
      const scale = Math.min(availW / base.width, availH / base.height) * (window.devicePixelRatio || 1);
      const viewport = page.getViewport({ scale });

      canvas.width = viewport.width;
      canvas.height = viewport.height;

      await page.render({ canvasContext: ctx, viewport }).promise;

      currentPage = num;
      updateUI();
      rendering = false;
    }

    function updateUI() {
      counter.textContent = currentPage + " / " + pdfDoc.numPages;
      prevBtn.disabled = currentPage <= 1;
      nextBtn.disabled = currentPage >= pdfDoc.numPages;
      [...dotsWrap.children].forEach((d, i) => {
        d.classList.toggle("active", i + 1 === currentPage);
      });
    }

    function buildDots() {
      dotsWrap.innerHTML = "";
      for (let i = 1; i <= pdfDoc.numPages; i++) {
        const dot = document.createElement("div");
        dot.className = "dot";
        dot.addEventListener("click", () => renderPage(i));
        dotsWrap.appendChild(dot);
      }
    }

    prevBtn.addEventListener("click", () => {
      if (currentPage > 1) renderPage(currentPage - 1);
    });
    nextBtn.addEventListener("click", () => {
      if (currentPage < pdfDoc.numPages) renderPage(currentPage + 1);
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft") prevBtn.click();
      if (e.key === "ArrowRight") nextBtn.click();
    });

    // swipe (mobile)
    let touchStartX = 0;
    stage.addEventListener("touchstart", (e) => {
      touchStartX = e.changedTouches[0].screenX;
    });
    stage.addEventListener("touchend", (e) => {
      const dx = e.changedTouches[0].screenX - touchStartX;
      if (Math.abs(dx) > 50) {
        if (dx < 0) nextBtn.click();
        else prevBtn.click();
      }
    });

    window.addEventListener("resize", () => renderPage(currentPage));

    pdfjsLib
      .getDocument(PDF_URL)
      .promise.then((pdf) => {
        pdfDoc = pdf;
        status.style.display = "none";
        stage.style.display = "flex";
        footer.style.display = "flex";
        buildDots();
        renderPage(1);
      })
      .catch((err) => {
        status.innerHTML =
          'Não foi possível carregar o PDF. <a href="' +
          PDF_URL +
          '" style="color:#7aa2ff">Clique aqui para abrir o arquivo diretamente</a>.';
        console.error(err);
      });
  </script>
</body>
</html>
