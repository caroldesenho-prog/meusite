<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Documento</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #0b0e14;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    overflow: hidden;
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    box-sizing: border-box;
  }
  #stage {
    flex: 1;
    position: relative;
    overflow: hidden;
    padding: 16px;
    box-sizing: border-box;
  }
  #track {
    display: flex;
    height: 100%;
    width: 300%;
    will-change: transform;
  }
  .slide {
    width: 33.3333%;
    height: 100%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .slide canvas {
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    border-radius: 6px;
    box-shadow: 0 4px 28px rgba(0, 0, 0, 0.5);
    user-select: none;
    pointer-events: none;
  }
  .nav-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: none;
    background: rgba(255, 255, 255, 0.1);
    color: #fff;
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(4px);
    transition: background 0.15s;
    z-index: 5;
  }
  .nav-btn:hover { background: rgba(255, 255, 255, 0.2); }
  .nav-btn:disabled { opacity: 0.25; cursor: default; }
  #prevBtn { left: 12px; }
  #nextBtn { right: 12px; }
  #footer {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 14px;
    color: #cbd2de;
    font-size: 13px;
  }
  #dots {
    display: flex;
    gap: 10px;
    max-width: 70vw;
    overflow-x: auto;
    padding: 4px 2px;
  }
  .dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #4a5468;
    border: 1px solid rgba(255, 255, 255, 0.15);
    flex-shrink: 0;
    transition: background 0.15s, transform 0.15s;
  }
  .dot.active { background: #7aa2ff; transform: scale(1.15); }
  #status {
    color: #cbd2de;
    text-align: center;
    padding: 60px 20px;
    font-size: 14px;
  }
</style>
</head>
<body>
  <div id="app">
    <div id="status">Carregando documento…</div>
    <div id="stage" style="display:none">
      <button id="prevBtn" class="nav-btn" aria-label="Página anterior">‹</button>
      <div id="track">
        <div class="slide" id="slotA"><canvas></canvas></div>
        <div class="slide" id="slotB"><canvas></canvas></div>
        <div class="slide" id="slotC"><canvas></canvas></div>
      </div>
      <button id="nextBtn" class="nav-btn" aria-label="Próxima página">›</button>
    </div>
    <div id="footer" style="display:none">
      <span id="counter">1 / 1</span>
      <div id="dots"></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    // Troque "post3.pdf" pelo nome exato do seu arquivo PDF
    const PDF_URL = "post3.pdf";
    const TRANS_MS = 450; // duração da transição (mais lenta e suave)
    const TRANS_EASING = "cubic-bezier(0.4, 0, 0.2, 1)"; // desacelera suave, sem ultrapassar o ponto final

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

    const status = document.getElementById("status");
    const stage = document.getElementById("stage");
    const footer = document.getElementById("footer");
    const track = document.getElementById("track");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const counter = document.getElementById("counter");
    const dotsWrap = document.getElementById("dots");

    let pdfDoc = null;
    let currentPage = 1;
    let W = 0;
    let animating = false;

    // order[0] = prev slot element, order[1] = curr slot element, order[2] = next slot element
    // this array is kept in sync with the actual left-to-right DOM order inside #track
    let order = [
      document.getElementById("slotA"),
      document.getElementById("slotB"),
      document.getElementById("slotC"),
    ];

    async function renderIntoSlot(pageNum, slotEl) {
      const canvas = slotEl.querySelector("canvas");
      const ctx = canvas.getContext("2d");
      if (!pageNum || pageNum < 1 || pageNum > pdfDoc.numPages) {
        canvas.width = 0;
        canvas.height = 0;
        return;
      }
      const page = await pdfDoc.getPage(pageNum);
      const availW = stage.clientWidth - 32;
      const availH = stage.clientHeight - 32;
      const base = page.getViewport({ scale: 1 });
      const scale = Math.min(availW / base.width, availH / base.height) * (window.devicePixelRatio || 1);
      const viewport = page.getViewport({ scale });
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      await page.render({ canvasContext: ctx, viewport }).promise;
    }

    function setTransform(px, withTransition) {
      track.style.transition = withTransition
        ? "transform " + TRANS_MS + "ms " + TRANS_EASING
        : "none";
      track.style.transform = "translateX(" + px + "px)";
      if (!withTransition) void track.offsetWidth; // force reflow
    }

    function waitForTransitionEnd() {
      return new Promise((resolve) => {
        const onEnd = () => {
          track.removeEventListener("transitionend", onEnd);
          resolve();
        };
        track.addEventListener("transitionend", onEnd);
      });
    }

    // Full (re)render of all three slots for the current page. Used on load and on direct jumps.
    async function renderAllSlots() {
      W = stage.clientWidth;
      track.appendChild(order[0]);
      track.appendChild(order[1]);
      track.appendChild(order[2]);
      await Promise.all([
        renderIntoSlot(currentPage - 1, order[0]),
        renderIntoSlot(currentPage, order[1]),
        renderIntoSlot(currentPage + 1, order[2]),
      ]);
      setTransform(-W, false);
      updateUI();
    }

    function updateUI() {
      counter.textContent = currentPage + " / " + pdfDoc.numPages;
      prevBtn.disabled = currentPage <= 1;
      nextBtn.disabled = currentPage >= pdfDoc.numPages;
      [...dotsWrap.children].forEach((d, i) => {
        d.classList.toggle("active", i + 1 === currentPage);
      });
    }

    function buildDots() {
      dotsWrap.innerHTML = "";
      for (let i = 1; i <= pdfDoc.numPages; i++) {
        const dot = document.createElement("div");
        dot.className = "dot";
        dotsWrap.appendChild(dot);
      }
    }

    // Recycle the slot that is now off-screen after a completed move, without
    // ever touching the slot the user is currently looking at (avoids flicker).
    async function completeMove(direction) {
      currentPage += direction;

      let recycled;
      if (direction === 1) {
        recycled = order[0];
        order = [order[1], order[2], recycled];
        track.appendChild(recycled); // move to the far right, off-screen
      } else {
        recycled = order[2];
        order = [recycled, order[0], order[1]];
        track.insertBefore(recycled, track.firstChild); // move to the far left, off-screen
      }

      setTransform(-W, false); // instant, no visual change (see reasoning below)

      const neededPage = direction === 1 ? currentPage + 1 : currentPage - 1;
      await renderIntoSlot(neededPage, recycled);
      updateUI();
      animating = false;
    }

    async function goAdjacent(direction) {
      if (animating || !pdfDoc) return;
      const target = currentPage + direction;
      if (target < 1 || target > pdfDoc.numPages) return;
      animating = true;
      setTransform(direction === 1 ? -2 * W : 0, true);
      await waitForTransitionEnd();
      await completeMove(direction);
    }

    prevBtn.addEventListener("click", () => goAdjacent(-1));
    nextBtn.addEventListener("click", () => goAdjacent(1));
    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft") goAdjacent(-1);
      if (e.key === "ArrowRight") goAdjacent(1);
    });

    // --- drag / swipe with real-time follow ---
    let dragging = false;
    let dragStartX = 0;
    let dragDx = 0;

    function onPointerDown(e) {
      if (e.target.closest(".nav-btn")) return; // let button clicks through untouched
      if (animating || !pdfDoc) return;
      dragging = true;
      dragStartX = e.clientX;
      dragDx = 0;
      track.style.transition = "none";
      if (stage.setPointerCapture && e.pointerId != null) {
        stage.setPointerCapture(e.pointerId);
      }
    }

    function onPointerMove(e) {
      if (!dragging) return;
      dragDx = e.clientX - dragStartX;
      if ((currentPage <= 1 && dragDx > 0) || (currentPage >= pdfDoc.numPages && dragDx < 0)) {
        dragDx *= 0.35; // rubber-band at the edges
      }
      track.style.transform = "translateX(" + (-W + dragDx) + "px)";
    }

    async function onPointerUp() {
      if (!dragging) return;
      dragging = false;

      const threshold = W * 0.18;
      const dx = dragDx;
      dragDx = 0;

      if (dx <= -threshold && currentPage < pdfDoc.numPages) {
        animating = true;
        setTransform(-2 * W, true);
        await waitForTransitionEnd();
        await completeMove(1);
      } else if (dx >= threshold && currentPage > 1) {
        animating = true;
        setTransform(0, true);
        await waitForTransitionEnd();
        await completeMove(-1);
      } else {
        setTransform(-W, true); // snap back, nothing changes
      }
    }

    stage.addEventListener("pointerdown", onPointerDown);
    stage.addEventListener("pointermove", onPointerMove);
    stage.addEventListener("pointerup", onPointerUp);
    stage.addEventListener("pointercancel", onPointerUp);
    stage.addEventListener("pointerleave", () => {
      if (dragging) onPointerUp();
    });

    window.addEventListener("resize", () => {
      if (pdfDoc && !animating) renderAllSlots();
    });

    pdfjsLib
      .getDocument(PDF_URL)
      .promise.then((pdf) => {
        pdfDoc = pdf;
        status.style.display = "none";
        stage.style.display = "block";
        footer.style.display = "flex";
        buildDots();
        renderAllSlots();
      })
      .catch((err) => {
        status.innerHTML =
          'Não foi possível carregar o PDF. <a href="' +
          PDF_URL +
          '" style="color:#7aa2ff">Clique aqui para abrir o arquivo diretamente</a>.';
        console.error(err);
      });
  </script>
</body>
</html>
