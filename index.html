<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Documento</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #0b0e14;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    box-sizing: border-box;
  }
  #stage {
    flex: 1;
    position: relative;
    overflow: hidden;
    padding: 16px;
    box-sizing: border-box;
  }
  #track {
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    width: 100%;
    will-change: transform;
  }
  .slide {
    position: absolute;
    top: 0;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
    padding: 16px;
  }
  .slide canvas {
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    border-radius: 6px;
    box-shadow: 0 4px 28px rgba(0, 0, 0, 0.5);
    user-select: none;
    pointer-events: none;
  }
  .nav-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: none;
    background: rgba(255, 255, 255, 0.1);
    color: #fff;
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(4px);
    transition: background 0.15s;
    z-index: 5;
  }
  .nav-btn:hover { background: rgba(255, 255, 255, 0.2); }
  .nav-btn:disabled { opacity: 0.25; cursor: default; }
  #prevBtn { left: 12px; }
  #nextBtn { right: 12px; }
  #footer {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 14px;
    color: #cbd2de;
    font-size: 13px;
  }
  #dots {
    display: flex;
    gap: 10px;
    max-width: 70vw;
    overflow-x: auto;
    padding: 4px 2px;
  }
  .dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #4a5468;
    border: 1px solid rgba(255, 255, 255, 0.15);
    flex-shrink: 0;
    transition: background 0.15s, transform 0.15s;
  }
  .dot.active { background: #7aa2ff; transform: scale(1.15); }
  #status {
    color: #cbd2de;
    text-align: center;
    padding: 60px 20px;
    font-size: 14px;
  }
</style>
</head>
<body>
  <div id="app">
    <div id="status">Carregando documento…</div>
    <div id="stage" style="display:none">
      <button id="prevBtn" class="nav-btn" aria-label="Página anterior">‹</button>
      <div id="track"></div>
      <button id="nextBtn" class="nav-btn" aria-label="Próxima página">›</button>
    </div>
    <div id="footer" style="display:none">
      <span id="counter">1 / 1</span>
      <div id="dots"></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    // Troque "post3.pdf" pelo nome exato do seu arquivo PDF
    const PDF_URL = "post3.pdf";
    const TRANS_MS = 420;
    const TRANS_EASING = "cubic-bezier(0.4, 0, 0.2, 1)";

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

    const status = document.getElementById("status");
    const stage = document.getElementById("stage");
    const footer = document.getElementById("footer");
    const track = document.getElementById("track");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const counter = document.getElementById("counter");
    const dotsWrap = document.getElementById("dots");

    let pdfDoc = null;
    let numPages = 0;
    let currentPage = 1;
    let W = 0;
    let animating = false;

    // Each page gets its OWN permanent slide element at a fixed left offset
    // based on its page number. We never move or relabel existing slides —
    // we only create new ones (for neighbours we haven't visited yet) and
    // remove ones that are far away. Navigating is always a single, direct
    // animation of the track's transform from the current fixed position to
    // the target fixed position.
    const slides = new Map(); // pageNum -> { el, rendered }

    function pageLeft(pageNum) {
      return (pageNum - 1) * W;
    }

    function createSlideEl(pageNum) {
      const el = document.createElement("div");
      el.className = "slide";
      el.style.left = pageLeft(pageNum) + "px";
      el.style.width = W + "px";
      const canvas = document.createElement("canvas");
      el.appendChild(canvas);
      track.appendChild(el);
      return el;
    }

    async function renderIntoSlot(pageNum, slotEl) {
      const canvas = slotEl.querySelector("canvas");
      const ctx = canvas.getContext("2d");
      const page = await pdfDoc.getPage(pageNum);
      const availW = W - 32;
      const availH = stage.clientHeight - 32;
      const base = page.getViewport({ scale: 1 });
      const scale = Math.min(availW / base.width, availH / base.height) * (window.devicePixelRatio || 1);
      const viewport = page.getViewport({ scale });
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      await page.render({ canvasContext: ctx, viewport }).promise;
    }

    async function ensureSlide(pageNum) {
      if (pageNum < 1 || pageNum > numPages) return;
      let entry = slides.get(pageNum);
      if (!entry) {
        entry = { el: createSlideEl(pageNum), rendered: false };
        slides.set(pageNum, entry);
      }
      if (!entry.rendered) {
        await renderIntoSlot(pageNum, entry.el);
        entry.rendered = true;
      }
    }

    function pruneFarSlides() {
      for (const [pageNum, entry] of slides) {
        if (Math.abs(pageNum - currentPage) > 1) {
          entry.el.remove();
          slides.delete(pageNum);
        }
      }
    }

    function setTransform(px, withTransition) {
      track.style.transition = withTransition
        ? "transform " + TRANS_MS + "ms " + TRANS_EASING
        : "none";
      track.style.transform = "translateX(" + px + "px)";
      if (!withTransition) void track.offsetWidth;
    }

    function waitForTransitionEnd() {
      return new Promise((resolve) => {
        const onEnd = () => {
          track.removeEventListener("transitionend", onEnd);
          resolve();
        };
        track.addEventListener("transitionend", onEnd);
      });
    }

    function updateUI() {
      counter.textContent = currentPage + " / " + numPages;
      prevBtn.disabled = currentPage <= 1;
      nextBtn.disabled = currentPage >= numPages;
      [...dotsWrap.children].forEach((d, i) => {
        d.classList.toggle("active", i + 1 === currentPage);
      });
    }

    function buildDots() {
      dotsWrap.innerHTML = "";
      for (let i = 1; i <= numPages; i++) {
        const dot = document.createElement("div");
        dot.className = "dot";
        dotsWrap.appendChild(dot);
      }
    }

    // Single, direct, continuous slide from the current fixed position to
    // the new page's fixed position. No mid-flight resets, no relabeling.
    async function goToPage(newPage) {
      if (animating || newPage < 1 || newPage > numPages || newPage === currentPage) return;
      animating = true;
      await Promise.all([ensureSlide(newPage - 1), ensureSlide(newPage), ensureSlide(newPage + 1)]);
      currentPage = newPage;
      setTransform(-pageLeft(currentPage), true);
      await waitForTransitionEnd();
      pruneFarSlides();
      updateUI();
      animating = false;
    }

    prevBtn.addEventListener("click", () => goToPage(currentPage - 1));
    nextBtn.addEventListener("click", () => goToPage(currentPage + 1));
    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft") goToPage(currentPage - 1);
      if (e.key === "ArrowRight") goToPage(currentPage + 1);
    });

    // --- drag / swipe with real-time follow ---
    let dragging = false;
    let dragStartX = 0;
    let dragDx = 0;

    function onPointerDown(e) {
      if (e.target.closest(".nav-btn")) return;
      if (animating || !pdfDoc) return;
      dragging = true;
      dragStartX = e.clientX;
      dragDx = 0;
      track.style.transition = "none";
      if (stage.setPointerCapture && e.pointerId != null) {
        stage.setPointerCapture(e.pointerId);
      }
    }

    function onPointerMove(e) {
      if (!dragging) return;
      dragDx = e.clientX - dragStartX;
      if ((currentPage <= 1 && dragDx > 0) || (currentPage >= numPages && dragDx < 0)) {
        dragDx *= 0.35; // rubber-band at the edges
      }
      track.style.transform = "translateX(" + (-pageLeft(currentPage) + dragDx) + "px)";
    }

    async function onPointerUp() {
      if (!dragging) return;
      dragging = false;

      const threshold = W * 0.18;
      const dx = dragDx;
      dragDx = 0;

      let target = currentPage;
      if (dx <= -threshold && currentPage < numPages) target = currentPage + 1;
      else if (dx >= threshold && currentPage > 1) target = currentPage - 1;

      if (target === currentPage) {
        setTransform(-pageLeft(currentPage), true); // not enough drag: settle back
        return;
      }

      animating = true;
      // slide directly from wherever the finger left off to the target's fixed spot
      setTransform(-pageLeft(target), true);
      await waitForTransitionEnd();
      currentPage = target;
      await Promise.all([ensureSlide(currentPage - 1), ensureSlide(currentPage + 1)]);
      pruneFarSlides();
      updateUI();
      animating = false;
    }

    stage.addEventListener("pointerdown", onPointerDown);
    stage.addEventListener("pointermove", onPointerMove);
    stage.addEventListener("pointerup", onPointerUp);
    stage.addEventListener("pointercancel", onPointerUp);
    stage.addEventListener("pointerleave", () => {
      if (dragging) onPointerUp();
    });

    function repositionAll() {
      W = stage.clientWidth;
      for (const [pageNum, entry] of slides) {
        entry.el.style.left = pageLeft(pageNum) + "px";
        entry.el.style.width = W + "px";
      }
      setTransform(-pageLeft(currentPage), false);
    }

    window.addEventListener("resize", () => {
      if (pdfDoc && !animating) repositionAll();
    });

    pdfjsLib
      .getDocument(PDF_URL)
      .promise.then(async (pdf) => {
        pdfDoc = pdf;
        numPages = pdf.numPages;
        W = stage.clientWidth;
        status.style.display = "none";
        stage.style.display = "block";
        footer.style.display = "flex";
        buildDots();
        await Promise.all([ensureSlide(currentPage - 1), ensureSlide(currentPage), ensureSlide(currentPage + 1)]);
        setTransform(-pageLeft(currentPage), false);
        updateUI();
      })
      .catch((err) => {
        status.innerHTML =
          'Não foi possível carregar o PDF. <a href="' +
          PDF_URL +
          '" style="color:#7aa2ff">Clique aqui para abrir o arquivo diretamente</a>.';
        console.error(err);
      });
  </script>
</body>
</html>
