<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Documento</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #0b0e14;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    overflow: hidden;
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    box-sizing: border-box;
  }
  #stage {
    flex: 1;
    position: relative;
    overflow: hidden;
    padding: 16px;
    box-sizing: border-box;
  }
  #track {
    display: flex;
    height: 100%;
    width: 300%;
    will-change: transform;
  }
  .slide {
    width: 33.3333%;
    height: 100%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .slide canvas {
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    border-radius: 6px;
    box-shadow: 0 4px 28px rgba(0, 0, 0, 0.5);
    user-select: none;
    pointer-events: none;
  }
  .nav-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: none;
    background: rgba(255, 255, 255, 0.1);
    color: #fff;
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(4px);
    transition: background 0.15s;
    z-index: 5;
  }
  .nav-btn:hover { background: rgba(255, 255, 255, 0.2); }
  .nav-btn:disabled { opacity: 0.25; cursor: default; }
  #prevBtn { left: 12px; }
  #nextBtn { right: 12px; }
  #footer {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 14px;
    color: #cbd2de;
    font-size: 13px;
  }
  #dots {
    display: flex;
    gap: 10px;
    max-width: 70vw;
    overflow-x: auto;
    padding: 4px 2px;
  }
  .dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #4a5468;
    border: 1px solid rgba(255, 255, 255, 0.15);
    flex-shrink: 0;
    cursor: pointer;
    transition: background 0.15s, transform 0.15s;
  }
  .dot:hover { transform: scale(1.2); }
  .dot.active { background: #7aa2ff; transform: scale(1.15); }
  #status {
    color: #cbd2de;
    text-align: center;
    padding: 60px 20px;
    font-size: 14px;
  }
</style>
</head>
<body>
  <div id="app">
    <div id="status">Carregando documento…</div>
    <div id="stage" style="display:none">
      <button id="prevBtn" class="nav-btn" aria-label="Página anterior">‹</button>
      <div id="track">
        <div class="slide" id="slotPrev"><canvas></canvas></div>
        <div class="slide" id="slotCurr"><canvas></canvas></div>
        <div class="slide" id="slotNext"><canvas></canvas></div>
      </div>
      <button id="nextBtn" class="nav-btn" aria-label="Próxima página">›</button>
    </div>
    <div id="footer" style="display:none">
      <span id="counter">1 / 1</span>
      <div id="dots"></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    // Troque "post3.pdf" pelo nome exato do seu arquivo PDF
    const PDF_URL = "post3.pdf";

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

    const status = document.getElementById("status");
    const stage = document.getElementById("stage");
    const footer = document.getElementById("footer");
    const track = document.getElementById("track");
    const slotPrev = document.getElementById("slotPrev");
    const slotCurr = document.getElementById("slotCurr");
    const slotNext = document.getElementById("slotNext");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const counter = document.getElementById("counter");
    const dotsWrap = document.getElementById("dots");

    let pdfDoc = null;
    let currentPage = 1;
    let W = 0; // stage width in px
    let animating = false;

    async function renderIntoSlot(pageNum, slotEl) {
      const canvas = slotEl.querySelector("canvas");
      const ctx = canvas.getContext("2d");
      if (!pageNum || pageNum < 1 || pageNum > pdfDoc.numPages) {
        canvas.width = 0;
        canvas.height = 0;
        return;
      }
      const page = await pdfDoc.getPage(pageNum);
      const availW = stage.clientWidth - 32;
      const availH = stage.clientHeight - 32;
      const base = page.getViewport({ scale: 1 });
      const scale = Math.min(availW / base.width, availH / base.height) * (window.devicePixelRatio || 1);
      const viewport = page.getViewport({ scale });
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      await page.render({ canvasContext: ctx, viewport }).promise;
    }

    function setTrackInstant(px) {
      track.style.transition = "none";
      track.style.transform = "translateX(" + px + "px)";
      // force reflow so the next transition change is picked up cleanly
      void track.offsetWidth;
    }

    async function renderTriple() {
      W = stage.clientWidth;
      await Promise.all([
        renderIntoSlot(currentPage - 1, slotPrev),
        renderIntoSlot(currentPage, slotCurr),
        renderIntoSlot(currentPage + 1, slotNext),
      ]);
      setTrackInstant(-W);
      updateUI();
    }

    function updateUI() {
      counter.textContent = currentPage + " / " + pdfDoc.numPages;
      prevBtn.disabled = currentPage <= 1;
      nextBtn.disabled = currentPage >= pdfDoc.numPages;
      [...dotsWrap.children].forEach((d, i) => {
        d.classList.toggle("active", i + 1 === currentPage);
      });
    }

    function buildDots() {
      dotsWrap.innerHTML = "";
      for (let i = 1; i <= pdfDoc.numPages; i++) {
        const dot = document.createElement("div");
        dot.className = "dot";
        dot.addEventListener("click", () => jumpTo(i));
        dotsWrap.appendChild(dot);
      }
    }

    async function jumpTo(pageNum) {
      if (animating || pageNum === currentPage || pageNum < 1 || pageNum > pdfDoc.numPages) return;
      currentPage = pageNum;
      await renderTriple();
    }

    async function goAdjacent(direction) {
      // direction: 1 = next, -1 = prev
      if (animating) return;
      const target = currentPage + direction;
      if (target < 1 || target > pdfDoc.numPages) return;
      animating = true;
      track.style.transition = "transform 0.3s ease";
      track.style.transform = "translateX(" + (-W - direction * W) + "px)";
      await new Promise((resolve) => {
        const onEnd = () => {
          track.removeEventListener("transitionend", onEnd);
          resolve();
        };
        track.addEventListener("transitionend", onEnd);
      });
      currentPage = target;
      await renderTriple();
      animating = false;
    }

    prevBtn.addEventListener("click", () => goAdjacent(-1));
    nextBtn.addEventListener("click", () => goAdjacent(1));
    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft") goAdjacent(-1);
      if (e.key === "ArrowRight") goAdjacent(1);
    });

    // --- drag / swipe with real-time follow ---
    let dragging = false;
    let dragStartX = 0;
    let dragDx = 0;

    function onPointerDown(e) {
      if (animating || !pdfDoc) return;
      dragging = true;
      dragStartX = e.clientX;
      dragDx = 0;
      track.style.transition = "none";
      stage.setPointerCapture && e.pointerId != null && stage.setPointerCapture(e.pointerId);
    }

    function onPointerMove(e) {
      if (!dragging) return;
      dragDx = e.clientX - dragStartX;

      // rubber-band resistance at the boundaries
      if ((currentPage <= 1 && dragDx > 0) || (currentPage >= pdfDoc.numPages && dragDx < 0)) {
        dragDx *= 0.35;
      }
      track.style.transform = "translateX(" + (-W + dragDx) + "px)";
    }

    function onPointerUp() {
      if (!dragging) return;
      dragging = false;

      const threshold = W * 0.18;
      track.style.transition = "transform 0.3s ease";

      if (dragDx <= -threshold && currentPage < pdfDoc.numPages) {
        animating = true;
        track.style.transform = "translateX(" + -2 * W + "px)";
        track.addEventListener(
          "transitionend",
          async function onEnd() {
            track.removeEventListener("transitionend", onEnd);
            currentPage += 1;
            await renderTriple();
            animating = false;
          },
          { once: true }
        );
      } else if (dragDx >= threshold && currentPage > 1) {
        animating = true;
        track.style.transform = "translateX(0px)";
        track.addEventListener(
          "transitionend",
          async function onEnd() {
            track.removeEventListener("transitionend", onEnd);
            currentPage -= 1;
            await renderTriple();
            animating = false;
          },
          { once: true }
        );
      } else {
        // not enough drag: snap back
        track.style.transform = "translateX(" + -W + "px)";
      }
    }

    stage.addEventListener("pointerdown", onPointerDown);
    stage.addEventListener("pointermove", onPointerMove);
    stage.addEventListener("pointerup", onPointerUp);
    stage.addEventListener("pointercancel", onPointerUp);
    stage.addEventListener("pointerleave", () => {
      if (dragging) onPointerUp();
    });

    window.addEventListener("resize", () => {
      if (pdfDoc) renderTriple();
    });

    pdfjsLib
      .getDocument(PDF_URL)
      .promise.then((pdf) => {
        pdfDoc = pdf;
        status.style.display = "none";
        stage.style.display = "block";
        footer.style.display = "flex";
        buildDots();
        renderTriple();
      })
      .catch((err) => {
        status.innerHTML =
          'Não foi possível carregar o PDF. <a href="' +
          PDF_URL +
          '" style="color:#7aa2ff">Clique aqui para abrir o arquivo diretamente</a>.';
        console.error(err);
      });
  </script>
</body>
</html>
