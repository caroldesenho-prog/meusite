<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Documento</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #0b0e14;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  #container {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
    gap: 16px;
    box-sizing: border-box;
  }
  canvas {
    display: block;
    width: 100%;
    max-width: 900px;
    height: auto;
    border-radius: 4px;
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
  }
  #status {
    color: #cbd2de;
    text-align: center;
    padding: 60px 20px;
    font-size: 14px;
  }
  #status a {
    color: #7aa2ff;
  }
  @media (max-width: 600px) {
    #container {
      padding: 12px 8px;
      gap: 10px;
    }
  }
</style>
</head>
<body>
  <div id="status">Carregando documento…</div>
  <div id="container"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    // Troque "documento.pdf" pelo nome exato do seu arquivo PDF
    const PDF_URL = "documento.pdf";
    const RENDER_WIDTH = 1400; // resolução interna (nitidez); a tela se ajusta via CSS

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

    const container = document.getElementById("container");
    const status = document.getElementById("status");

    async function renderPage(page) {
      const unscaledViewport = page.getViewport({ scale: 1 });
      const scale = RENDER_WIDTH / unscaledViewport.width;
      const viewport = page.getViewport({ scale });

      const canvas = document.createElement("canvas");
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      container.appendChild(canvas);

      const ctx = canvas.getContext("2d");
      await page.render({ canvasContext: ctx, viewport }).promise;
    }

    pdfjsLib
      .getDocument(PDF_URL)
      .promise.then(async (pdf) => {
        status.remove();
        for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
          const page = await pdf.getPage(pageNum);
          await renderPage(page);
        }
      })
      .catch((err) => {
        status.innerHTML =
          'Não foi possível carregar o PDF. <a href="' +
          PDF_URL +
          '">Clique aqui para abrir o arquivo diretamente</a>.';
        console.error(err);
      });
  </script>
</body>
</html>
